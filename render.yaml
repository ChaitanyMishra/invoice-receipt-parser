databases:
  - name: invoicedb
    databaseName: invoicedb
    plan: free

services:
  - type: redis
    name: redis
    plan: free
    ipAllowList: []

  - type: web
    name: invoice-web
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_URL
        fromDatabase:
          name: invoicedb
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: worker
    name: invoice-worker
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DB_URL
        fromDatabase:
          name: invoicedb
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
